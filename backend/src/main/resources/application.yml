spring:
  application:
    name: bill-assistant-backend
  ai:
    openai:
      api-key: ${AI_API_KEY:disabled}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:file:./.ai-secrets.env[.properties],optional:file:./backend/.ai-secrets.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bill_assistant}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:bill_assistant}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  ai:
    enabled: ${AI_ENABLED:false}
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost,capacitor://localhost}"
  auth:
    access-max-age-seconds: ${AUTH_ACCESS_MAX_AGE_SECONDS:900}
    refresh-max-age-seconds: ${AUTH_REFRESH_MAX_AGE_SECONDS:2592000}
    refresh-grace-seconds: ${AUTH_REFRESH_GRACE_SECONDS:5}
    jwt-secret: ${AUTH_JWT_SECRET}
    issuer: bill-assistant
    audience: bill-assistant-web
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
